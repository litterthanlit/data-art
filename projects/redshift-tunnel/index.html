<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Redshift Tunnel, a Three.js light tunnel made of real galaxies and quasars from DESI Data Release 1, coloured by their measured redshift." />
    <meta name="theme-color" content="#05060a" />
    <title>Redshift Tunnel</title>
  </head>
  <body>
    <main id="stage" aria-label="Redshift Tunnel artwork">
      <canvas id="scene" aria-hidden="true"></canvas>
      <p id="status" class="status" role="status" aria-live="polite">Loading 600,000 galaxies…</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
