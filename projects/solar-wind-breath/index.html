<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solar Wind Breath, an interactive Three.js data sculpture of heliospheric plasma and coronal mass ejections."
    />
    <title>Solar Wind Breath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <main id="stage" aria-label="Solar Wind Breath 3D artwork">
      <header class="title">
        <h1>Solar Wind Breath</h1>
        <p id="status" aria-live="polite">Loading</p>
      </header>

      <section class="moment" aria-label="Current moment">
        <p id="phase" class="phase" aria-live="polite">Quiet solar wind</p>
        <p id="moment-time" class="moment-time" aria-hidden="true"></p>
      </section>

      <section class="controls" aria-label="Controls">
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>

        <fieldset class="layers">
          <legend>Layers</legend>
          <label>
            <input type="checkbox" name="layer" data-layer="plasma" checked />
            Plasma
          </label>
          <label>
            <input type="checkbox" name="layer" data-layer="cme" checked />
            CME flares
          </label>
          <label>
            <input type="checkbox" name="layer" data-layer="storm" checked />
            Storm pulse
          </label>
        </fieldset>

        <label class="time-control">
          <span id="time-label">Time</span>
          <input id="time" type="range" min="0" max="1000" value="0" aria-describedby="time-label" />
        </label>
      </section>

      <aside id="inspector" class="inspector" aria-live="polite">
        Drag to explore the breath
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
